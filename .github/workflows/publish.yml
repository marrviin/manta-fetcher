# 发布：推送 v* tag 触发，构建后发布 @manta-fetcher/core 与 @manta-fetcher/mcp 到 npm。
#
# 版本约定：monorepo 内两个发布包共用一个版本号，以 tag 为准（v0.2.3 → 两包都发 0.2.3），
# 发版时只打 tag：git tag v0.2.3 && git push origin v0.2.3。
# 幂等：某包版本已在 npm 上存在则跳过该包（重复触发 / 部分失败后重跑安全）。
#
# 前置：仓库 Secrets 配置 NPM_TOKEN（npmjs.com → Access Tokens → Automation token）。
# provenance 需要 id-token: write 与 package.json 里的 repository 字段（已配置）。

name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance（发布溯源签名）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 对齐版本号到 tag（v0.2.3 → 0.2.3），保证 core 与 mcp 版本一致、依赖指向正确
      - name: 对齐版本号到 tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/mcp; do
            node -e "
              const fs = require('fs');
              const f = '$pkg/package.json';
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = '$VERSION';
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            "
          done
          echo "发布版本: $VERSION"

      - name: 构建
        run: pnpm --filter @manta-fetcher/core --filter @manta-fetcher/mcp build

      # 已发布过的版本跳过（npm view 查不到该版本才发布）；pnpm publish 会把
      # mcp 依赖里的 workspace:* 替换为对齐后的确切版本
      - name: 发布 @manta-fetcher/core
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if npm view "@manta-fetcher/core@$VERSION" version > /dev/null 2>&1; then
            echo "@manta-fetcher/core@$VERSION 已在 npm 上，跳过"
          else
            pnpm --filter @manta-fetcher/core publish --no-git-checks --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布 @manta-fetcher/mcp
        run: |
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "@manta-fetcher/mcp@$VERSION" version > /dev/null 2>&1; then
            echo "@manta-fetcher/mcp@$VERSION 已在 npm 上，跳过"
          else
            pnpm --filter @manta-fetcher/mcp publish --no-git-checks --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
