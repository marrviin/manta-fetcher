# 微信公众号文章页（mp.weixin.qq.com），由 sogou-weixin 的 composite 调用，也可独立抓取
name: weixin-article
description: 微信公众号文章正文，返回 Markdown（含图片）
match:
  - "https://mp.weixin.qq.com/s*"

navigation:
  userAgent: "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.6 Mobile/15E148 Safari/604.1"
  waitUntil: "visible:#js_content, #page-content, .rich_media_content"
  timeoutMs: 30000

extraction:
  mainContent: "#js_content, #page-content, .rich_media_content"
  title: "#activity-name, .rich_media_title"
  remove:
    - "#js_pc_qr_code" # 桌面端二维码浮层
    - ".qr_code_pc"

images:
  # 微信图片有防盗链（Referer 校验），浏览器上下文下载可带 cookie/referer
  mode: download
  saveDir: cache/images/weixin
