# JoySpace(京东内部文档协作平台)文档页,需京东统一登录(ME 扫码/ERP)
# 流程:fetch_joyspace → 无登录态快速失败并提示 login_joyspace → 弹有头浏览器扫码
#       → 登录成功跳回 joyspace.jd.com → 登录态存 auth/joyspace.storage.json
#
# 页面结构(实测):
#   main.joyspace-wrap > section.joyspace-content > article.joyspace-page-main
#     > .doc-page.mf-doc-editor-page > .doc-page-container.virtual-render-observer  ← 正文
#   噪音(工具条/目录大纲/侧栏/头部)均为 mainContent 的兄弟/祖先旁支,天然排除
name: joyspace
description: 抓取 JoySpace 文档页(京东内部),返回结构化 IR,需登录后使用
match:
  - "https://joyspace.jd.com/h/*"

navigation:
  # 正文容器可见即内容已开始渲染;SPA 重客户端渲染,不用 networkidle
  waitUntil: "visible:.doc-page-container"
  timeoutMs: 45000

actions:
  # 正文容器是 virtual-render-observer(虚拟滚动渲染),滚动到底触发全量加载
  - scroll: { maxScrolls: 40 }

extraction:
  mainContent: ".doc-page-container"
  remove:
    # 文档标题下方 meta 行(作者头像/创建时间/阅读数)
    - ".page-title-below"
    # 文末点赞按钮 + 评论区(Sincerely like / All comments / Write your comment / Send 等)
    - ".other-area"

images:
  mode: keep-url
  saveDir: cache/images/joyspace

auth:
  required: true
  # 登录入口用页面 URL 本身:无登录态时会被重定向到 authme.jd.com 统一登录(ME 扫码/ERP)
  # successUrl: 登录成功后跳回 joyspace.jd.com
  successUrl: "joyspace.jd.com"
  # 运行时检测:抓取后被重定向回统一登录页,视为登录态失效
  loginRedirect: "authme.jd.com/login"
