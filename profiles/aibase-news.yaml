# AIBase AI 新闻列表页：最新 N 条 → composite 逐篇抓正文 → fetch_aibase_news_top3
name: aibase-news
description: AIBase AI 新闻资讯列表，返回最新文章（标题/链接/摘要），支持组合抓取正文
match:
  - "https://news.aibase.com/zh/news*"

navigation:
  waitUntil: "visible:a[href*='/zh/news/']"
  timeoutMs: 30000

extraction:
  mainContent: "article" # 列表容器恰为 article 元素；正文噪音由通用清理处理
  title: "h1"

structured:
  fields:
    articles:
      selector: "a[href*='/zh/news/']"
      multiple: true
      fields:
        title: { selector: "& div[class*='font600']" } # 标题在第一个 font600 div
        url: { selector: "&", attribute: "href" }
        summary: { selector: "div[class*='truncate2']" }

composite:
  detailProfile: aibase-article
  urlField: url
  detailLimit: 3
  tool: fetch_aibase_news_top3
