# 掘金热榜（排行榜）场景：需要登录态
# 流程：fetch_juejin_hot → 无登录态时报错指引 → login_juejin_hot 开窗登录（自动检测 sessionid cookie）
#       → 登录态存 auth/juejin-hot.storage.json → 重试即可正常抓取
name: juejin-hot
description: 获取掘金热榜文章列表（排名/标题/链接/作者/热度），登录后可用
match:
  - "https://juejin.cn/hot/articles*"

navigation:
  waitUntil: "visible:a.article-item-link"
  timeoutMs: 30000

extraction:
  # 列表页：正文就是榜单本身；移除头像图（结构化字段里已有作者信息）
  mainContent: ".hot-list-wrap"
  title: "h1"
  remove:
    - ".article-author-img"
    - ".article-hot svg"

structured:
  fields:
    articles:
      selector: "a.article-item-link"
      multiple: true
      limit: 3
      fields:
        rank:   { selector: ".article-number" }
        title:  { selector: ".article-title" }
        url:    { selector: "&", attribute: "href" }   # & = 字段作用域元素自身
        author: { selector: ".article-author-name-text" }
        views:  { selector: ".author-text" }           # 第一个 .author-text = 浏览
        heat:   { selector: ".article-hot" }

# 组合编排：列表页结构化字段 → 逐篇抓详情正文，生成组合工具 fetch_juejin_hot_top3
composite:
  detailProfile: juejin      # 详情页用文章 profile 抓
  urlField: url              # 列表字段里作为详情 URL 的属性
  detailLimit: 3             # 前 3 篇
  tool: fetch_juejin_hot_top3

auth:
  required: true
  loginUrl: "https://juejin.cn/hot/articles"
  # 会话 cookie：存在即判定登录成功（掘金 SSO 写入 .juejin.cn）
  sessionCookie: "sessionid,sessionid_ss"
